<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>2048</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #222222;
        --muted: #8f8f8f;
        --low: #e9e9e9;
        --accent: #0088cc;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        user-select: none;
      }

      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 2%;
        padding: 2.5%;
      }

      #bar {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex: none;
      }

      #score-label {
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      #score {
        font-size: 1.5rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }

      #hint {
        font-size: 0.7rem;
        color: var(--muted);
      }

      #board {
        position: relative;
        /* Largest square that fits whatever shape the host frame has. vmin
           tracks the shorter side, so this holds at any aspect ratio. */
        flex: 0 0 auto;
        width: min(100%, 80vmin);
        aspect-ratio: 1 / 1;
        margin: auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 2.2%;
        padding: 2.2%;
        border-radius: 6px;
        background: var(--low);
        touch-action: none;
      }

      .cell {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        background: rgba(127, 127, 127, 0.12);
        font-weight: 700;
        font-size: clamp(0.85rem, 7vmin, 2.1rem);
        transition: background 0.09s ease;
      }

      .cell[data-v="0"] {
        color: transparent;
      }
      .cell[data-v="2"] { background: #eee4da; color: #776e65; }
      .cell[data-v="4"] { background: #ede0c8; color: #776e65; }
      .cell[data-v="8"] { background: #f2b179; color: #f9f6f2; }
      .cell[data-v="16"] { background: #f59563; color: #f9f6f2; }
      .cell[data-v="32"] { background: #f67c5f; color: #f9f6f2; }
      .cell[data-v="64"] { background: #f65e3b; color: #f9f6f2; }
      .cell[data-v="128"] { background: #edcf72; color: #f9f6f2; }
      .cell[data-v="256"] { background: #edcc61; color: #f9f6f2; }
      .cell[data-v="512"] { background: #edc850; color: #f9f6f2; }
      .cell[data-v="1024"] { background: #edc53f; color: #f9f6f2; }
      .cell[data-v="2048"] { background: #edc22e; color: #f9f6f2; }
      .cell.big { background: #3c3a32; color: #f9f6f2; }

      .cell.small {
        font-size: clamp(0.65rem, 5vmin, 1.5rem);
      }

      #over {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        background: rgba(127, 127, 127, 0.35);
        backdrop-filter: blur(2px);
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--fg);
      }

      #over.visible {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="bar">
        <div>
          <div id="score-label">Score</div>
          <div id="score">0</div>
        </div>
        <div id="hint">Swipe or arrow keys</div>
      </div>

      <div id="board">
        <div id="over">Game over</div>
      </div>
    </div>

    <script>
      // Same cache-busting stamp as the games on the shared shell; the host
      // hands it over in the URL, and it must reach game.js too.
      let assetV = new URLSearchParams(location.search).get("v") || "";
      if (!/^[0-9a-f]{1,40}$/.test(assetV)) {
        assetV = "";
      }
      document.write(
        '<script src="' + (assetV ? "game.js?v=" + assetV : "game.js") + '"><\/script>'
      );
    </script>
  </body>
</html>
